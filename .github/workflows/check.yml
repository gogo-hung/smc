name: check-live
on:
  push:
    branches: [research]
    paths: ['tools/check-trigger']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 120
          mkdir -p results
          for p in api/health api/rules "api/signals?status=trigger"; do echo "== $p"; curl -s -m 90 "https://smc-scanner-krbg.onrender.com/$p" | head -c 3000; echo; done > results/live.txt
          curl -s -m 60 https://smc-scanner-krbg.onrender.com/app.js | grep -o "smc-rules-v[0-9]*" | head -1 >> results/live.txt
          git config user.name research-bot && git config user.email research-bot@users.noreply.github.com
          git add results && git commit -m "live check" && git pull --rebase && git push
