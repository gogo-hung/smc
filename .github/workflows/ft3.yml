name: freqtrade-scalp
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: freqtrade3
  cancel-in-progress: true
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - id: c
        uses: actions/cache/restore@v4
        with:
          path: tools/ft3/data
          key: ft3-okx-5m-v1
      - if: steps.c.outputs.cache-hit != 'true'
        run: |
          docker build --build-arg TAG=$([ ${{ matrix.st }} = NFIX ] && echo stable || echo stable) -t ft tools/ft3 && mkdir -p tools/ft3/data && chmod -R 777 tools/ft3
          docker run --rm -v $PWD/tools/ft3:/freqtrade/user_data ft download-data --config user_data/config.json --trading-mode futures --timeframes 5m 15m 1h 4h 1d --timerange 20240801- > dl.log 2>&1 || true
          tail -20 dl.log; du -sh tools/ft3/data
      - if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tools/ft3/data
          key: ft3-okx-5m-v1
  bt:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        st: [E0V1EFt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: tools/ft3/data
          key: ft3-okx-5m-v1
      - name: 抓策略原始碼
        run: |
          set -x
          mkdir -p tools/ft3/strategies
          git clone -q --depth 1 https://github.com/iterativv/NostalgiaForInfinity nfi || true
          ls nfi | head -30
          F=$(ls nfi/NostalgiaForInfinityX*.py | sort -V | tail -1); echo "NFI file: $F"
          cp "$F" tools/ft3/strategies/ || true
          git clone -q https://github.com/remiotore/freqtrade e0 && (cd e0 && git checkout -q 44beaeb6a420cd8e9f2e4ea93e11d6cfa192ee03) && cp e0/strategies/E0V1EFt.py tools/ft3/strategies/ || true
          # 原始寫法 dataframe.loc[(), [...]] = (0, 'long_out') 讓欄位變成 object，新版 pandas shift 會出錯；改成等效的整數 0
          sed -i "s/dataframe.loc\[(), \['exit_long', 'exit_tag'\]\] = (0, 'long_out')/dataframe['exit_long'] = 0/; s/dataframe.loc\[(), \['exit_short', 'exit_tag'\]\] = (0, 'short_out')/dataframe['exit_short'] = 0/" tools/ft3/strategies/E0V1EFt.py
          grep -n "exit_long'\] = 0\|exit_short'\] = 0" tools/ft3/strategies/E0V1EFt.py
          ls -la tools/ft3/strategies
          head -40 tools/ft3/strategies/E0V1EFt.py
      - run: docker build --build-arg TAG=$([ ${{ matrix.st }} = NFIX ] && echo stable || echo stable) -t ft tools/ft3 && mkdir -p tools/ft3/backtest_results out && chmod -R 777 tools/ft3
      - name: 回測 ${{ matrix.st }}
        run: |
          ST=${{ matrix.st }}
          if [ "$ST" = NFIX ]; then ST=$(basename $(ls tools/ft3/strategies/NostalgiaForInfinityX*.py | head -1) .py); fi
          echo "strategy=$ST"
          timeout 19500 docker run --rm -v $PWD/tools/ft3:/freqtrade/user_data ft backtesting --config user_data/config.json --strategy $ST --timerange 20250101- --fee 0.00022 --export trades > out/bt.log 2>&1 || true
          grep -A12 "STRATEGY SUMMARY" out/bt.log || tail -40 out/bt.log
          cp tools/ft3/backtest_results/backtest-result-*.zip out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ft3-${{ matrix.st }}
          path: out/
  sum:
    needs: bt
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: logs
      - run: |
          python3 tools/ft3/analyze.py || true
          { for f in $(find logs -name bt.log); do echo "== $f"; grep -A10 'STRATEGY SUMMARY' $f || tail -40 $f; done; } > results/ft3-debug.txt 2>&1
          git config user.name research-bot && git config user.email research-bot@users.noreply.github.com
          git add results && git commit -m "ft3 result" && git pull --rebase && git push
