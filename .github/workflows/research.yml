name: research
on:
  push:
    branches: [research]
    paths-ignore: ['results/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: d
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: research-cache
          key: hist-m5-v2
          restore-keys: |
            hist-m5-
            hist-665-
      - run: npm i --no-save ccxt@4.5.84
      - run: node tools/strat3.js
        env: { REQUEST_GAP_MS: "60", DAYS: "665", SOURCE: "ccxt", EXCHANGE: "okx", M15: "1", NODE_OPTIONS: "--max-old-space-size=12288" }
      - if: always()
        run: |
          mkdir -p results && cp research-cache/*.md results/ && cp research-cache/trades-*.json results/ 2>/dev/null || true
          git config user.name research-bot && git config user.email research-bot@users.noreply.github.com
          git add results && git commit -m "research result" && git pull --rebase && git push
