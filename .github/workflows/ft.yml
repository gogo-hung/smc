name: freqtrade-backtest
on:
  push:
    branches: [research]
    paths: ['tools/ft/**', '.github/workflows/ft.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: freqtrade
  cancel-in-progress: true
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      s: ${{ steps.s.outputs.s }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: echo "s=$(ls tools/ft/strategies/*.py | xargs -n1 basename | sed 's/.py$//' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  bt:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        st: ${{ fromJson(needs.list.outputs.s) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: tools/ft/data
          key: ft-okx-futures-v1
          restore-keys: ft-okx-futures-v1-
      - run: docker build -t ft tools/ft && mkdir -p tools/ft/data tools/ft/backtest_results out && chmod -R 777 tools/ft
      - name: 回測 ${{ matrix.st }}
        run: |
          for r in "2025:20250101-20260101" "2026:20260101-" "all:20250101-"; do tag=${r%%:*}; tr=${r#*:}
            docker run --rm -v $PWD/tools/ft:/freqtrade/user_data ft backtesting --config user_data/config.json --strategy ${{ matrix.st }} --timerange $tr --fee 0.0005 --export none > out/bt-${{ matrix.st }}-$tag.log 2>&1 || true
          done
          grep -A12 "STRATEGY SUMMARY" out/bt-${{ matrix.st }}-all.log || tail -5 out/bt-${{ matrix.st }}-all.log
      - uses: actions/upload-artifact@v4
        with:
          name: ft-${{ matrix.st }}
          path: out/
  sum:
    needs: bt
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: logs
      - run: |
          python3 tools/ft/parse.py
          for f in logs/*/bt-*-all.log; do n=$(basename $f .log); grep -A12 "STRATEGY SUMMARY" $f > results/ft-$n.txt 2>/dev/null || tail -20 $f > results/ft-$n.txt; done
          git config user.name research-bot && git config user.email research-bot@users.noreply.github.com
          git add results && git commit -m "freqtrade result" && git pull --rebase && git push
