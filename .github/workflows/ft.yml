name: freqtrade-backtest
on:
  push:
    branches: [research]
    paths: ['tools/ft/**', '.github/workflows/ft.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: git config core.fileMode false
      - uses: actions/cache/restore@v4
        with:
          path: tools/ft/data
          key: ft-okx-futures-v1
          restore-keys: ft-okx-futures-v1-
      - run: docker build -t ft tools/ft && mkdir -p tools/ft/data tools/ft/backtest_results && chmod -R 777 tools/ft
      - name: 下載 OKX 合約歷史 K 線（有快取就只補新的）
        run: |
          set -o pipefail
          docker run --rm -v $PWD/tools/ft:/freqtrade/user_data ft download-data --config user_data/config.json --trading-mode futures -t 15m 1h 4h 12h 1d --timerange 20240601- 2>&1 | tail -20
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: tools/ft/data
          key: ft-okx-futures-v1-${{ github.run_id }}
      - name: 回測（每個策略分開跑：各自的週期）
        run: |
          for st in $(ls tools/ft/strategies/*.py | xargs -n1 basename | sed 's/.py$//'); do
            for r in "2025:20250101-20260101" "2026:20260101-" "all:20250101-"; do tag=${r%%:*}; tr=${r#*:}
              docker run --rm -v $PWD/tools/ft:/freqtrade/user_data ft backtesting --config user_data/config.json --strategy $st --timerange $tr --fee 0.0005 --export trades > tools/ft/bt-$st-$tag.log 2>&1 || echo "::warning::$st $tag 失敗：$(grep -iE 'error|exception' tools/ft/bt-$st-$tag.log | tail -2 | tr '\n' ' ' | cut -c1-250)"
              mkdir -p tools/ft/res/$tag && mv tools/ft/backtest_results/backtest-result-* tools/ft/res/$tag/ 2>/dev/null || true
            done
          done
          ls tools/ft/res/*
      - if: always()
        run: |
          docker run --rm -v $PWD/tools/ft:/ud --entrypoint python ft /ud/summary.py || echo "::warning::summary 失敗"
          mkdir -p results && cp tools/ft/ft-summary.md results/ 2>/dev/null; tail -60 tools/ft/bt-mabStra-all.log > results/ft-bt-sample.log 2>/dev/null || true
          git config user.name research-bot && git config user.email research-bot@users.noreply.github.com
          git add results && git commit -m "freqtrade result" && git stash -u -q; git pull --rebase && git push
